# Calder Wheels API Reverse Proxy
# Place in /etc/nginx/conf.d/calder-api.conf
# Requires: SSL cert path (find with: `nginx -T 2>/dev/null | grep ssl_certificate | head -2`)
#
# Then: nginx -t && systemctl reload nginx

server {
    listen 8443 ssl http2;
    server_name server.covedigitalworks.com;

    # ── Reuse existing cPanel SSL cert ────────────────────────────────────
    # Find your actual cert paths with:
    #   grep -r ssl_certificate /etc/nginx/conf.d/ | head -2
    # Replace these paths with the actual ones from your server:
    ssl_certificate     /etc/ssl/certs/server.covedigitalworks.com.crt;
    ssl_certificate_key /etc/ssl/private/server.covedigitalworks.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Configurator API ───────────────────────────────────────────────────
    location /api/configurator/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Fitment API ────────────────────────────────────────────────────────
    location /api/fitment/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health check ───────────────────────────────────────────────────────
    location = /api/health {
        return 200 '{"status":"ok","service":"calder-api-proxy"}';
        add_header Content-Type application/json;
    }
}